# Deploys one environment (staging or production) to AWS. Runs only on manual dispatch from a commit that passed CI.
# Production requires approval: configure the "production" GitHub environment with required reviewers.
# AWS access uses GitHub OIDC (no stored keys). Per-environment settings live in GitHub environment variables:
#   AWS_REGION, AWS_DEPLOY_ROLE_ARN, ECR_REPOSITORY, ECS_CLUSTER, API_TASK_FAMILY, WORKER_TASK_FAMILY,
#   WEB_BUCKET, WEB_DISTRIBUTION_ID, API_BASE_URL (https://api.<domain>), GOOGLE_CLIENT_ID (optional, public)
name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  NPM_VERSION: "11.21.1"

jobs:
  backend:
    name: Backend image, API and worker
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push the image (tagged with the commit)
        id: image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build -f apps/backend/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "uri=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Current task definitions
        run: |
          aws ecs describe-task-definition --task-definition "${{ vars.API_TASK_FAMILY }}" \
            --query taskDefinition > api-task.json
          aws ecs describe-task-definition --task-definition "${{ vars.WORKER_TASK_FAMILY }}" \
            --query taskDefinition > worker-task.json
      - id: api-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: api-task.json
          container-name: api
          image: ${{ steps.image.outputs.uri }}
      - id: worker-task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: worker-task.json
          container-name: worker
          image: ${{ steps.image.outputs.uri }}
      - name: Deploy API (rolling; health-checked; circuit breaker rolls back on failure)
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.api-task.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: api
          wait-for-service-stability: true
      - name: Deploy worker
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.worker-task.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: worker
          wait-for-service-stability: true
      - name: Smoke test
        run: |
          curl -fsS "${{ vars.API_BASE_URL }}/health"
          curl -fsS "${{ vars.API_BASE_URL }}/ready"
          curl -fsS "${{ vars.API_BASE_URL }}/api/v1/countries" > /dev/null

  web:
    name: Web build to S3 + CloudFront
    runs-on: ubuntu-latest
    needs: backend
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm install -g npm@${{ env.NPM_VERSION }}
      - run: npm ci --ignore-scripts
      - run: npm run build:packages
      - name: Build
        run: npm run build -w @ahq/web
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      # Old hashed chunks are kept so players mid-session can still lazy-load them (no --delete).
      - name: Upload (hashed assets immutable; index.html never cached; source maps not published)
        working-directory: apps/web/dist
        run: |
          aws s3 sync . "s3://${{ vars.WEB_BUCKET }}" --exclude "*.map" --exclude index.html \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 cp index.html "s3://${{ vars.WEB_BUCKET }}/index.html" --cache-control "no-cache"
      - name: Invalidate index.html
        run: |
          aws cloudfront create-invalidation --distribution-id "${{ vars.WEB_DISTRIBUTION_ID }}" \
            --paths /index.html /
      - uses: actions/upload-artifact@v4
        with:
          name: web-sourcemaps-${{ github.sha }}
          path: apps/web/dist/**/*.map
          retention-days: 90
